#!

<!DOCTYPE html>

<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta http-equiv="refresh" content="0; url={{ '/' | relative_url }}">
		<link rel="canonical" href="{{ '/' | absolute_url }}">

		{% seo %}
		{% feed_meta %}
		<link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="//fonts.googleapis.com/css?family=Quattrocento|Raleway|Vollkorn:400,400i,700,700i">
		<link rel="stylesheet" href="{{ site.baseurl }}/css/main.css">
		<link rel="apple-touch-icon" href="{{ site.baseurl }}/apple-touch-icon.png">
		<link rel="icon" type="image/png" href="{{ site.baseurl }}/touch-icon.png" sizes="192x192">
		<link rel="icon" type="image/png" href="{{ site.baseurl }}/images/favicon.png">

		{% if jekyll.environment == 'production' and site.google_analytics_key != '' %}
			<script>
				window.ga=window.ga||function(){(ga.q=ga.q||[]).push(arguments)};ga.l=+new Date;
				ga('create', '{{ site.google_analytics_key }}', 'auto');
				ga('send', 'pageview');
			</script>
			<script async src='https://www.google-analytics.com/analytics.js'></script>
		{% endif %}
	</head>

	<body>
		<script>
			window.location.replace("{{ '/' | relative_url }}");
		</script>
		<main style="font-family: Raleway, sans-serif; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem;">
			<div>
				<p>This page has moved.</p>
				<p><a href="{{ '/' | relative_url }}">Continue to the Loreto Solutions coming soon page</a>.</p>
			</div>
		</main>
	</body>
</html>
