<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loreto Solutions | Coming Soon</title>
  <meta name="description" content="Loreto Solutions is preparing something new. Check back soon.">
  <style>
    @font-face {
      font-family: "Raleway";
      src: url("{{ '/fonts/Raleway-VariableFont_wght.ttf' | relative_url }}") format("truetype");
      font-weight: 100 900;
      font-style: normal;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Raleway", "Avenir Next", "Segoe UI", sans-serif;
      color: #121212;
      background: #ffffff;
    }

    .site-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .panel {
      width: min(100%, 480px);
      padding: clamp(2rem, 5vw, 3.5rem);
      border: 1px solid rgba(18,18,18,0.08);
      border-radius: 32px;
      background: #ffffff;
      box-shadow: 0 20px 60px rgba(18,18,18,0.08);
      text-align: center;
    }

    .panel img {
      width: min(100%, 320px);
      height: auto;
      border-radius: 12px;
    }

    h1 {
      margin: 1.75rem 0 0.5rem;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .phone {
      margin: 0;
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      color: rgba(18,18,18,0.62);
    }

    .phone a {
      color: #138b55;
      text-decoration: none;
      font-weight: 700;
    }

    .phone a:hover {
      text-decoration: underline;
    }

    @media (prefers-reduced-motion: no-preference) {
      .panel {
        animation: rise 0.6s ease both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main class="site-shell">
    <section class="panel">
      <img src="{{ '/images/logo.png' | relative_url }}" alt="Loreto Solutions logo">
      <h1>Launching soon.</h1>
      <p class="phone">For enquiries, call <a href="tel:{{ site.data.company.phone }}">{{ site.data.company.phone }}</a></p>
    </section>
  </main>
</body>
</html>
